[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "GalSNRubin"
version = "0.1.0"
description = "Monte Carlo Rubin follow-up of Galactic neutrino-triggered supernovae"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "pandas>=2", "astropy>=6", "matplotlib>=3.8", "ccsnlc", "galdust"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
galsnrubin = "galsnrubin.cli:main"
[tool.setuptools.packages.find]
include = ["galsnrubin*"]
